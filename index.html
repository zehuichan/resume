<html lang="zh-CN">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/resume/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 具体年限由 main.ts 在运行时依据 experienceStartYear 计算后覆盖，这里不写死数字避免逐年过期 -->
    <meta name="description" content="陈泽辉 · 前端负责人简历 · Vue / Taro / uniapp 实战经验" />
    <meta name="theme-color" content="#f5f4ed" />
    <script>
      // 防闪烁：在首帧绘制前把保存的主题写到 <html data-theme>（只有 kami / dark 两种）
      ;(function () {
        var theme = 'kami'
        try {
          if (localStorage.getItem('resume-theme') === 'dark') theme = 'dark'
        } catch (e) {
          /* localStorage 不可用时用默认值 */
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
