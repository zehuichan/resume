<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/resume/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 路由就绪后由对应页面的元数据覆盖 -->
    <meta name="description" content="陈泽辉 · 前端负责人简历 · Vue / Taro / uniapp 实战经验" />
    <meta name="theme-color" content="#fafaf8" />
    <script>
      ;(function () {
        var root = document.documentElement
        root.dataset.resume = 'classic'

        var stored = null
        try {
          stored = localStorage.getItem('resume-theme')
        } catch (e) {
          // 隐私模式下 localStorage 不可读，退回系统偏好
        }

        var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = stored === 'dark' || stored === 'light' ? stored : systemDark ? 'dark' : 'light'

        root.dataset.theme = theme
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme

        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'dark' ? '#15181d' : '#ffffff'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@400..700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>陈泽辉 · 前端负责人</title>
    <script type="module" crossorigin src="/resume/assets/index-BF72oNkl.js"></script>
    <link rel="stylesheet" crossorigin href="/resume/assets/index-Cr3s4cKh.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
