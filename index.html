<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 路由就绪后由对应页面的元数据覆盖 -->
    <meta name="description" content="陈泽辉 · 前端负责人 / 前端架构师 · 20 人前端团队 · 前端基建、低代码与 AI 工程化" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(function () {
        var root = document.documentElement
        root.dataset.resume = 'classic'

        var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = systemDark ? 'dark' : 'light'

        root.dataset.theme = theme
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme

        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'dark' ? '#191c1e' : '#ffffff'
      })()
    </script>
    <!--
      网页字体不挡首屏：先按 media="print" 加载（不阻塞渲染），到了再换成 all。
      连不上 Google 的网络（例如国内）会卡到超时，挡着的话整页要白屏约 30 秒；不挡就先用系统中文字体显示。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="web-fonts"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>陈泽辉 · 前端负责人</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
